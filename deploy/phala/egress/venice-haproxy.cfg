# The venice-worker's only route to its provider.
#
# DUPLICATED ON PURPOSE. The copy that RUNS is the inline
# configs.venice_egress_haproxy.content block in deploy/phala/docker-compose.dev.yml,
# because dstack uploads only the compose text: a `file:` reference would
# be neither transferred nor measured. The copy at deploy/phala/egress/venice-haproxy.cfg
# exists to be reviewed and diffed. tests/unit/content-tier-boundary.test.ts
# asserts the two are byte-identical.
global
  log stdout format raw local0
  maxconn 2048

defaults
  mode tcp
  timeout connect 5s
  # The application enforces a ten-minute hard provider deadline. Keep the
  # tunnel slightly longer so the network boundary cannot truncate an
  # authorized slow response before cancellation and billing finalize.
  timeout client 660s
  timeout server 660s
  log global

resolvers publicdns
  nameserver one 1.1.1.1:53
  nameserver two 9.9.9.9:53
  hold valid 60s

frontend venice_sni
  bind *:443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  acl is_venice req.ssl_sni -i api.venice.ai
  use_backend venice if is_venice
  # Anything else is dropped (no default backend).

backend venice
  server venice api.venice.ai:443 resolvers publicdns init-addr none
