# AnonRouter confidential content plane: PROD5 (US-WEST-1, node 26), POOLED PROVIDER WORKER.
# PREPRODUCTION / SYNTHETIC MANIFEST.
#
# ============================ REBUILD REQUIRED ==============================
#
# This compose is NOT deployable as it stands.
#
# 2 image(s) pinned below were built from source this tree has moved
# past. Deploying one would ship the previous behaviour under a new release id,
# and every measurement would agree, because the measurement is of the compose
# and the compose is what was reviewed.
#
# WHAT AN ENTRY ASSERTS, AND WHAT IT DOES NOT. Each one is a BUILD fact: a
# declared input moved after the digest was published, so a rebuild produces
# different bytes. Whether the running roles BEHAVE differently is a separate
# question this check does not answer and cannot. "We looked and the change is
# behaviourally inert" is a reason to rebuild and repin cheaply. It is never a
# reason to deploy the stale digest, because the next reader inherits the
# judgement and not the evidence for it.
#
#   ghcr.io/anonrouter/confidential-content-plane
#     3 declared input(s) moved since e9998e9 (scripts/export-content-plane.ts,
#     src/contentPlane.ts, src/operations/serviceLifecycle.ts); Re-export with
#     `npx tsx scripts/export-content-plane.ts <dir>`, publish and sign the
#     image from the public repository, then move resolvedDigest, tag and
#     sourceCommit together in this contract and repin the digest in
#     gen-prod5-xl-compose.mjs, in the SAME change, and regenerate the composes.
#     Do NOT narrow the input set to make this pass: the closure is derived from
#     src/contentPlane.ts, so narrowing it means describing an image that is not
#     the one being built. FOR THE POOL TOPOLOGY: the pool generator reads its
#     digests from this contract, so there is nothing to repin in it. If the
#     rebuilt image is for the pool only, give POOL_MEASURED_IMAGES its own
#     entry (digest and sourceCommit) and leave the xl entry at the digest the
#     retained per-provider compose pins. Then regenerate with `node
#     deploy/phala/gen-prod5-pool-compose.mjs`.
#
#   ghcr.io/anonrouter/anonrouter-dstack-ingress
#     1 declared input(s) moved since 9c47e63
#     (deploy/phala/images/ingress-delegated/Dockerfile); Rebuild with
#     `deploy/phala/build-image-crane.sh deploy/phala/images/ingress-delegated
#     ghcr.io/anonrouter/anonrouter-dstack-ingress rev-<sha>`, then move
#     resolvedDigest and sourceCommit together in this contract and repin the
#     digest in gen-prod5-xl-compose.mjs, in the SAME change, and regenerate the
#     composes. FOR THE POOL TOPOLOGY: the pool generator reads its digests from
#     this contract, so there is nothing to repin in it. If the rebuilt image is
#     for the pool only, give POOL_MEASURED_IMAGES its own entry (digest and
#     sourceCommit) and leave the xl entry at the digest the retained
#     per-provider compose pins. Then regenerate with `node
#     deploy/phala/gen-prod5-pool-compose.mjs`.
#
# deploy/phala/production-preflight.sh FAILS while this block is present. Clear
# it by building, publishing and pinning each image in the SAME change, then
# regenerate this file.
# ============================================================================
#
# GENERATED by deploy/phala/gen-prod5-pool-compose.mjs. Do not hand-edit: the
# pool worker's environment is 6 providers' URLs, credentials and tokens in one
# block, and the one mistake that matters is a base URL beside another
# provider's credential. The table in pool-topology.mjs is the single source of
# truth for this file and for the edge's credential routes.
#
# WHAT THIS REPLACES. docker-compose.prod5-xl.yml runs one worker and one
# egress proxy per provider. Here ONE worker and ONE proxy serve 6 bearer-key
# providers:
#   venice, fireworks, deepinfra, tinfoil, near-ai, phala-ai
# Bedrock keeps its own worker and proxy. Chutes is not in this topology.
# docker-compose.prod5-xl.yml is retained as the rollback target.
#
# WHAT POOLING GIVES UP, stated before anything it keeps. The pool worker holds
# every pooled provider's credential and sees every pooled provider's prompts.
# If that process is compromised, the attacker has all of them and can send
# any of them to any host the pool can reach. Nothing in this file prevents
# that, and whole-CVM attestation does not restore compartments inside the CVM.
#
# THE CEILING BUDGET. TWO OF THESE NUMBERS ARE UNMEASURED and are marked:
#
#   ingress 192m + edge 96m + relay 1536m + compat 768m + attest 384m
#   + control-egress 96m + bedrock-worker 512m
#   + 3 egress x 96m (pool, bedrock, release-collateral)
#   + pool-worker 1024m             UNMEASURED placeholder
#   + release-collateral 384m       UNMEASURED placeholder
#   + credential-state-init 64m      one-shot; exits before pool-worker starts
#   + mock 128m
#   = 5472 MB capped: 72.9% of the large production runs on (7503 MB MemTotal,
#     measured), 145.8% of a medium (3752 MB MemTotal, PROJECTED as 4096 x 0.916:
#     no medium has run this deployment).
#
# Neither pool-worker nor release-collateral has been run under load. Their
# ceilings and V8 heap caps follow the shape of the phala-ai worker's measured
# envelope and none of its evidence, and plan item W7 replaces them. This
# budget is arithmetic on declared limits. It is not headroom.
#
# A MEDIUM DOES NOT FIT, WHATEVER THOSE TWO NUMBERS BECOME. The services carried
# over unchanged declare 3680 MB on their own, 98.1% of the projected medium,
# before the pool worker, the release-collateral role or their two proxies get
# a byte. Reaching a medium needs measured ceilings for relay, compat and
# attest as well.
#
# ISOLATION, stated as what this file contains:
#
#   - pool-worker reaches the Internet only through pool-egress, which admits
#     10 provider hostnames by SNI. No GitHub or Base host is among them.
#   - release-collateral reaches it only through release-collateral-egress,
#     which admits 5 hosts:
#       github.com, raw.githubusercontent.com, api.github.com,
#       mainnet.base.org, base-rpc.publicnode.com
#     Its environment is its role and one token. It is given no provider
#     credential, no metadata token and no volume.
#   - ONE CONTROL LANE PER CONSUMER. relay, compat, pool-worker and
#     bedrock-worker each reach the control proxy on a network no other
#     consumer joins. In the per-provider topology they all join one network
#     and every worker listens on all interfaces.
#   - Among relay, compat, pool-worker, bedrock-worker, release-collateral and
#     attest, the only pairs that share a network are relay with pool-worker,
#     relay with bedrock-worker, compat with relay, and pool-worker with
#     release-collateral. pool-worker and bedrock-worker share none.
#   - relay, pool-worker and bedrock-worker hold the same WORKER_RPC_TOKEN, so
#     for the two workers network reachability is the separation.
#   - pool-worker holds one metadata token per pooled provider and no shared or
#     deployment token. bedrock-worker holds only its own.
#   - credential-state is mounted by pool-worker, under the volume name, mount
#     path and file names the per-provider workers use, so either topology
#     reads what the other wrote. The only other service that mounts it is
#     credential-state-init, a one-shot with no network and no secret that makes
#     the volume the worker's account's before pool-worker starts.
#   - GCP/control receives no provider credential and no content. What crosses
#     the bridge is the fixed content-free allowlist in CONTROL_RPC_CONTRACT.md.
#
# SYNTHETIC. Every pooled provider's base URL, and NEAR's keyless endpoint
# discovery URL, is on the in-CVM mock, and PROVIDER_TRANSPORT_PROFILE is
# `synthetic`, under which src/config.ts refuses to boot a pool with any
# credential-bearing base URL on a real provider origin. No real provider
# credential is needed anywhere in this deployment. A production manifest must
# not contain a mock.
#
# pool-egress keeps its production allowlist and its Internet attachment. No
# pool-worker setting in this file names a host it admits; it is present so a
# capacity measurement counts every container production runs.
#
# RELEASE-COLLATERAL IN THIS RENDER: UNCHANGED FROM PRODUCTION. The role has no
# mock upstream: its lookups go to fixed public hosts and no setting redirects
# them. So there were two choices. Cut it off, by leaving its proxy off the
# routable network, and every lookup fails closed. Or leave it exactly as
# production has it, reaching the 5 real public hosts, keyless. This file
# does the second: release-collateral and release-collateral-egress are
# byte-identical to the production manifest's.
#
# WHY. This file exists to measure the production topology, and a role whose
# upstream is unreachable does none of its work: no fetch, no cache fill, no
# TLS session. Its ceiling above is a placeholder that only a run in which it
# can reach its hosts replaces. It also keeps the network shape identical in
# both manifests, so the isolation checked on one is the isolation of the
# other. What it costs is that a synthetic deployment can make this role's
# public lookups to GitHub and a Base RPC for real. The role is given no
# provider credential in this file, and the deployment needs no real one.
#
# Do not assume an ordinary synthetic run exercises it. The mock answers a
# model list and chat completions and nothing else, so plan item W7 has to
# drive this role on purpose or it measures an idle process.
#
# Deploy on the production OS image (--image dstack-0.5.9). SSH is unavailable
# there; container health is established from attestation evidence and external
# behaviour, never by reaching inside the CVM.

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "2"

services:

  # ---------------------------------------------------------------------------
  # dstack-ingress: the customer's TLS terminates HERE, inside the TD. Phala's
  # external gateway forwards raw TCP for the custom domain and never receives
  # the private key, the session keys, or a byte of plaintext.
  #
  # UNCHANGED from the per-provider synthetic manifest except for the public name.
  #
  # MULTI-DOMAIN, AND EVERY NAME IS MEASURED. One name:
  #   preprod-usw1-pool.private.anonrouter.ai
  #
  # Upstream issues a SEPARATE certificate per name and selects it by SNI, so
  # each name has its own key and its own SPKI. That is why the attestation
  # producer binds the origin the caller actually connected to and observes THAT
  # name's certificate, rather than assuming one key covers the deployment. See
  # src/gateway/service.ts.
  ingress:
    # Production derives from the reviewed upstream digest and adds one exact
    # Route53 CNAME after upstream's own scoped-role bootstrap. Preproduction
    # uses upstream directly and can never mutate the production alias.
    image: dstacktee/dstack-ingress:2.3@sha256:527c53523b9226782a11dbd800a3ff55e8a1f0b88e6224e8f7e4db7419769fbe
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      DNS_PROVIDER: route53
      # No DOMAIN and no TARGET_ENDPOINT: upstream treats single-domain and
      # multi-domain as mutually exclusive branches, and a leftover DOMAIN would
      # add a name to the certificate list with no backend behind it.
      DOMAINS: |
        preprod-usw1-pool.private.anonrouter.ai
      ROUTING_MAP: |
        preprod-usw1-pool.private.anonrouter.ai=edge:8080
      # The upstream manual hook writes each challenge under this measured,
      # Route-53-hosted suffix. The public CNAME is owner-managed in Namecheap;
      # the production image creates the private alias CNAME after assuming the
      # existing scoped Route53 role.
      DELEGATION_ZONE: public-api.private.anonrouter.ai
      GATEWAY_DOMAIN: _.${DSTACK_GATEWAY_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # The delegated target is a CNAME, and Route53 forbids a CAA record at
      # the same name. Production uses the zone ancestor's existing
      # letsencrypt.org authorization; the derived image makes this flag
      # effective in delegated mode. Synthetic keeps upstream's default.
      SET_CAA: "true"
      AWS_ROLE_ARN: ${ACME_ROUTE53_ROLE_ARN}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${ACME_ROUTE53_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${ACME_ROUTE53_SECRET_ACCESS_KEY}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
      - evidences:/evidences
    mem_limit: 192m
    networks:
      - cvm-edge
      - cvm-internet

  edge:
    <<: *hardened
    # edge-POOL, not the xlarge edge. The difference is the credential
    # administration block and nothing else: the xlarge edge sends each
    # provider's credential routes to that provider's own worker, and six of
    # those workers are one process here. This image rewrites each public
    # /v1/credentials/<slug>/... path to that provider's OWN namespaced path on
    # the pool, one exact match at a time, with no wildcard backend and nothing
    # taken from the request. Bedrock's routes still go to Bedrock's worker.
    image: ghcr.io/anonrouter/anonrouter-edge-ingress-pool@sha256:df06302f38c72a2147f8e4b97de232cf3bbc6416ca1f7a5f8e0c6091c00d61ee
    platform: linux/amd64
    volumes:
      - evidences:/evidences:ro
    tmpfs:
      - /tmp:size=16m,nosuid,nodev
      - /config:size=8m,nosuid,nodev
      - /data:size=8m,nosuid,nodev
    mem_limit: 96m
    networks:
      - cvm-edge
      - cvm-relay
      - cvm-attest
      - cvm-compat
      # The two workers it routes credential administration to. A Caddyfile
      # backend is not reachability: the single-provider edge named a worker it
      # had no network path to, and answered 502 on every credential request.
      #
      # This does not connect the workers to each other. Each is only on its
      # own rpc network; the edge bridges them at L7 through exact-match public
      # routes and forwards nothing else.
      - cvm-rpc-pool
      - cvm-rpc-bedrock

  # ---------------------------------------------------------------------------
  # The content tier. Holds prompts and responses transiently in memory and
  # writes neither. No database, no Valkey, no account identity, no provider
  # credential, and no routable network.
  #
  # UNCHANGED from the per-provider topology except where it points: seven of
  # its eight worker URLs name the pool, Phala AI's is under the variable name
  # src/config.ts actually reads, and its control lane is its own.
  # ---------------------------------------------------------------------------
  relay:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: relay
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN}
      ALLOW_INLINE_TICKET: "false"
      # Media is an explicit measured production posture. Both values must
      # match the GCP control roles: relay handles plaintext only inside this
      # TD, while control performs content-free authorization and settlement.
      IMAGE_GENERATION_ENABLED: "true"
      SPEECH_GENERATION_ENABLED: "true"
      # /auto classifies and selects entirely inside this TD. The image bakes the
      # embedding model and fixes ROUTER_ALLOW_REMOTE_MODELS=false, so enabling
      # this does not add an egress path or disclose classifier output to GCP.
      ROUTER_ENABLED: "true"
      # The generic 100 ms default predates the in-TD embedding classifier and
      # is shorter than real ONNX inference. Keep the request bounded, but give
      # the local offline model enough time to initialize and classify.
      ROUTER_TIMEOUT_MS: "5000"
      REQUEST_BODY_LIMIT_BYTES: "10000000"
      CONTROL_RPC_URL: http://control.anonrouter.internal:8444
      # EVERY POOLED PROVIDER IS AT THE POOL. The relay addresses a worker as
      # <base URL>/internal/<provider>/<operation>, with one base URL per
      # provider, so 6 providers on one base URL need no relay change.
      WORKER_RPC_URL: http://pool-worker:3000
      FIREWORKS_WORKER_RPC_URL: http://pool-worker:3000
      DEEPINFRA_WORKER_RPC_URL: http://pool-worker:3000
      TINFOIL_WORKER_RPC_URL: http://pool-worker:3000
      NEAR_WORKER_RPC_URL: http://pool-worker:3000
      PHALA_AI_WORKER_RPC_URL: http://pool-worker:3000
      # NOT POOLED, and it has no worker here. The relay always has a Chutes
      # worker URL: left unset it defaults to a chutes-worker this topology
      # does not define. So it is set, and it names the pool, which registers
      # no Chutes route.
      CHUTES_WORKER_RPC_URL: http://pool-worker:3000
      # Bedrock stays on its own worker.
      BEDROCK_WORKER_RPC_URL: http://bedrock-worker:3000
      RELAY_RPC_TOKEN: ${RELAY_RPC_TOKEN}
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      COMPAT_RPC_TOKEN: ${COMPAT_RPC_TOKEN}
      ALLOW_COMPAT_MODE: "true"
      # WAN deadlines. The measured control RTT is ~154 ms, so same-host
      # defaults would expire mid-request.
      CONTROL_RPC_TIMEOUT_MS: "15000"
      WORKER_RPC_TIMEOUT_MS: "620000"
      GATEWAY_ATTESTATION_ENABLED: "false"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # The per-provider topology's ceiling, carried over. It was sized for
    # per-provider fanout plus the in-TD embedding classifier used by /auto,
    # and nothing has measured the relay with two workers behind it.
    mem_limit: 1536m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - cvm-relay
      - cvm-rpc-pool
      - cvm-rpc-bedrock
      # Its OWN control lane. See control-egress.
      - cvm-control-relay

  # ---------------------------------------------------------------------------
  # OpenAI-compatibility broker. ONE public endpoint, as required. It sees
  # plaintext, which is why it lives inside the TD. It holds no provider
  # credential and no database.
  #
  # UNCHANGED from the per-provider topology except for its control lane.
  # ---------------------------------------------------------------------------
  compat:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: compat
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN}
      ALLOW_COMPAT_MODE: "true"
      COMPAT_RPC_TOKEN: ${COMPAT_RPC_TOKEN}
      CONTROL_RPC_URL: http://control.anonrouter.internal:8444
      RELAY_INGRESS_URL: http://relay:3000
      CONTROL_RPC_TIMEOUT_MS: "15000"
      RELAY_FORWARD_TIMEOUT_MS: "650000"
      GATEWAY_ATTESTATION_ENABLED: "false"
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    mem_limit: 768m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - cvm-compat
      - cvm-relay
      - cvm-control-compat

  # ---------------------------------------------------------------------------
  # Gateway attestation. The ONLY service mounting the dstack socket, separate
  # precisely so the relay does not hold an app-wide key oracle: anything that
  # reaches the socket can derive every key the app uses and mint a quote over
  # arbitrary report data.
  #
  # UNCHANGED from the per-provider synthetic manifest, networks included, except for
  # the public name it attests to.
  # ---------------------------------------------------------------------------
  attest:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: gateway-attestation
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN}
      GATEWAY_ATTESTATION_ENABLED: "true"
      # MEASURED LITERALS, canonical first, and the same list the ingress serves.
      # The origins this TD may claim are part of the compose hash. (Written
      # without the dollar-brace form on purpose: a variable reference inside a
      # comment is still a variable reference to anything that interpolates the
      # file as text, and an unset name there has already blocked one release.)
      #
      # The attestation producer binds ONE of these per document: the one whose
      # host matches the caller's connection, falling back to the canonical
      # first entry. It observes that name's certificate for the SPKI, because
      # dstack-ingress issues one certificate per name.
      GATEWAY_PUBLIC_ORIGIN: https://preprod-usw1-pool.private.anonrouter.ai
      GATEWAY_RELEASE_ID: ${GATEWAY_RELEASE_ID}
      # A MEASURED LITERAL. An unmeasured switch that turns on a privacy claim
      # is worth nothing.
      GATEWAY_TRANSPORT: in-tee-tls
      # The address attest completes a REAL handshake against, so the SPKI it
      # publishes is the one actually served. There is deliberately no way to
      # hand it a fingerprint: completing a handshake requires the private key,
      # so observing one is proof of possession rather than a claim of it.
      GATEWAY_TLS_TERMINATOR: ingress:443
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - cvm-attest
      - cvm-edge

  # ---------------------------------------------------------------------------
  # The content tier's only route to GCP control, originating mTLS. What crosses
  # is content-free authorization metadata whose field set is pinned by
  # tests/unit/rpc-boundary-contract.test.ts.
  #
  # ONE LANE PER CONSUMER, and this is the change from the per-provider
  # topology. There, relay, compat and all eight workers join a single
  # cvm-control-egress network to reach this proxy. Every one of them listens
  # on 0.0.0.0 and the workers share one WORKER_RPC_TOKEN, so that network
  # puts every worker's RPC port on the same segment as every other worker,
  # whatever the per-worker rpc networks say (review finding C4).
  #
  # Here each consumer has a network of its own, holding that consumer and this
  # proxy and nobody else. The proxy answers to the same name on each, so no
  # consumer's configuration changes. Image, environment and ceiling are
  # UNCHANGED from the per-provider topology.
  # ---------------------------------------------------------------------------
  control-egress:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-control-egress-gcp@sha256:9b6d16d8d76a59a8bbd0359f3647b13cd2db53ad3b480f35034ce32e7adf6812
    platform: linux/amd64
    cap_add:
      - NET_BIND_SERVICE
    user: "99:99"
    environment:
      TEE_CONTROL_CLIENT_PEM_B64: ${TEE_CONTROL_CLIENT_PEM_B64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$TEE_CONTROL_CLIENT_PEM_B64" | base64 -d > /tmp/tee-control-client.pem
        # Refuse to start rather than fall back to an unauthenticated
        # connection: a missing client certificate must be a hard failure.
        grep -q 'BEGIN EC PRIVATE KEY\|BEGIN PRIVATE KEY' /tmp/tee-control-client.pem
        grep -q 'BEGIN CERTIFICATE' /tmp/tee-control-client.pem
        unset TEE_CONTROL_CLIENT_PEM_B64
        exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    tmpfs:
      - /tmp:size=8m,nosuid,nodev
    mem_limit: 96m
    networks:
      cvm-control-relay:
        aliases:
          - control.anonrouter.internal
      cvm-control-compat:
        aliases:
          - control.anonrouter.internal
      cvm-control-pool:
        aliases:
          - control.anonrouter.internal
      cvm-control-bedrock:
        aliases:
          - control.anonrouter.internal
      cvm-internet: {}

  # ---------------------------------------------------------------------------
  # CREDENTIAL-STATE-INIT. A one-shot that makes the credential-state volume the
  # property of the account pool-worker runs as, and exits. pool-worker does
  # not start until it has exited 0.
  #
  # WHY IT EXISTS (POOL_CVM_TEST_RESULTS.md, finding 2). The content-plane image
  # runs as `node`, and up to v1.0.25 it had no /var/lib/anonrouter-worker. So
  # Docker creates the mount point, and a fresh volume, owned by root. The
  # worker cannot write its replay log or the Venice keyset overlay there, and
  # every capability-gated credential install, rotation and revocation fails
  # closed with 503 capability_replay_log_unavailable. Observed on a fresh CVM
  # in both topologies.
  #
  # An image that creates the directory node-owned fixes a FRESH volume only:
  # Docker copies an image's ownership into a named volume while the volume is
  # empty, and an existing volume keeps what it has. This deployment reuses the
  # per-provider topology's volume by name, so the ownership is set here, on
  # every boot, whatever the volume's history. It is idempotent.
  #
  # WHAT IT IS GIVEN. The image pool-worker runs, so the uid and gid are checked
  # against the same /etc/passwd the worker's account resolves against. Root,
  # because only root may chown, with every capability dropped except CHOWN
  # and FOWNER. No DAC_OVERRIDE: the program takes each directory back before
  # it reads it. No network at all, no secret, three literal settings, a
  # read-only root filesystem, and the volume as its only mount.
  # ---------------------------------------------------------------------------
  credential-state-init:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    # A one-shot. Compose starts it again on every `up`, which is every boot.
    restart: "no"
    user: "0:0"
    cap_add:
      - CHOWN
      - FOWNER
    network_mode: none
    environment:
      CREDENTIAL_STATE_DIR: /var/lib/anonrouter-worker
      CREDENTIAL_STATE_UID: "1000"
      CREDENTIAL_STATE_GID: "1000"
    entrypoint: ["node", "-e"]
    command:
      - |
        "use strict";
        // Runs as root with CAP_CHOWN and CAP_FOWNER only, before pool-worker starts.
        const fs = require("fs");
        const dir = process.env.CREDENTIAL_STATE_DIR;
        const uid = Number(process.env.CREDENTIAL_STATE_UID);
        const gid = Number(process.env.CREDENTIAL_STATE_GID);
        if (!dir || !(uid > 0) || !(gid > 0)) throw new Error("credential-state-init: settings missing");
        // pool-worker's USER node resolves against this image's /etc/passwd. Refuse
        // to hand the volume to numbers that are not that account's.
        const account = fs.readFileSync("/etc/passwd", "utf8").split("\n")
          .map((line) => line.split(":")).find((fields) => fields[0] === "node");
        if (!account || Number(account[2]) !== uid || Number(account[3]) !== gid) {
          throw new Error("credential-state-init: node is not " + uid + ":" + gid + " in this image");
        }
        let entries = 0;
        const give = (path) => {
          const stat = fs.lstatSync(path);
          entries += 1;
          if (stat.isSymbolicLink()) {
            // Never followed: lchown changes the link itself; chmod would change its target.
            fs.lchownSync(path, uid, gid);
            return;
          }
          if (!stat.isDirectory()) {
            fs.lchownSync(path, uid, gid);
            fs.chmodSync(path, 0o600);
            return;
          }
          // Take it first: without DAC_OVERRIDE, root cannot list a directory the
          // worker owns at 0700. Then hand it back.
          fs.lchownSync(path, 0, 0);
          fs.chmodSync(path, 0o700);
          for (const name of fs.readdirSync(path)) give(path + "/" + name);
          fs.lchownSync(path, uid, gid);
          fs.chmodSync(path, 0o700);
        };
        give(dir);
        console.log("credential-state-init: " + entries + " entries owned by " + uid + ":" + gid);
    volumes:
      - credential-state:/var/lib/anonrouter-worker
    # The image's own healthcheck asks a server this process never starts.
    # Spelled as test NONE, not "disable: true": Compose treats them the same,
    # but Phala's deploy API rejects a healthcheck with no test field (HTTP 422,
    # observed on a real CVM in run 2 of POOL_CVM_TEST_RESULTS.md).
    healthcheck:
      test: ["NONE"]
    mem_limit: 64m

  # ---------------------------------------------------------------------------
  # THE POOL. One process serving 6 bearer-key providers.
  #
  # It holds each of their credentials and sees each of their prompts. That is
  # the accepted loss the header states, and nothing below undoes it. What the
  # block does is keep everything ELSE away from that process: no route to
  # GitHub or Base, no dstack socket, no certificate volume, no AWS setting, no
  # other role's service token, and no network shared with the Bedrock worker.
  #
  # src/config.ts refuses to boot this role with a credential or a metadata
  # token for a provider the list does not name, with a shared or deployment
  # metadata token, or outside capability mode
  # (tests/unit/pool-worker-config.test.ts). tests/unit/prod5-pool-boot.test.ts
  # loads that configuration from THIS block.
  # ---------------------------------------------------------------------------
  pool-worker:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: pool-worker
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # A MEASURED LITERAL: which providers this process serves is part of the
      # deployment's identity. Canonical names, so NEAR is near-ai here though
      # its public credential slug and its replay file say near.
      POOL_PROVIDERS: venice,fireworks,deepinfra,tinfoil,near-ai,phala-ai
      # SYNTHETIC: the only origin a provider key may be sent to is the in-CVM
      # mock. config.ts refuses to boot if any base URL below is anywhere else,
      # so this file cannot also be pointed at a real provider. This literal and
      # the mock are what make it a preproduction manifest and nothing else.
      PROVIDER_TRANSPORT_PROFILE: synthetic
      # LITERALS, so a verifier reading the attested manifest sees exactly which
      # upstreams this build is configured for.
      VENICE_BASE_URL: http://mock-provider:3000/v1
      FIREWORKS_BASE_URL: http://mock-provider:3000/v1
      DEEPINFRA_BASE_URL: http://mock-provider:3000/v1
      TINFOIL_BASE_URL: http://mock-provider:3000/v1
      NEAR_BASE_URL: http://mock-provider:3000/v1
      # Not a credential-bearing URL, so the profile above does not pin it. On
      # the mock anyway, so that no setting in this block names a real host.
      NEAR_ENDPOINTS_URL: http://mock-provider:3000/endpoints
      PHALA_AI_BASE_URL: http://mock-provider:3000/v1
      # Each credential arrives as an ENCRYPTED environment value and is written
      # to tmpfs by the entrypoint: this role requires a file for every listed
      # provider and rejects a plain variable. The paths are the ones each
      # provider's own worker uses.
      VENICE_INFERENCE_KEY_FILE: /tmp/venice-key
      FIREWORKS_API_KEY_FILE: /tmp/fireworks-key
      DEEPINFRA_API_KEY_FILE: /tmp/deepinfra-key
      TINFOIL_API_KEY_FILE: /tmp/tinfoil-key
      NEAR_API_KEY_FILE: /tmp/near-key
      PHALA_AI_API_KEY_FILE: /tmp/phala-ai-key
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      # The per-provider topology's deployment id, unchanged. Control binds
      # each metadata token to (deployment, provider), so keeping the id and
      # the tokens keeps that contract as it is.
      CONFIDENTIAL_DEPLOYMENT_ID: us-west-1-prod5-xl
      # AR-02, pooled: ONE metadata token PER PROVIDER, each presented only for
      # that provider's calls. There is deliberately no METADATA_RPC_TOKEN and
      # no deployment token: either would be an authority that is no one
      # provider's, and this role refuses to boot holding one.
      METADATA_RPC_TOKEN_VENICE: ${METADATA_RPC_TOKEN_VENICE}
      METADATA_RPC_TOKEN_FIREWORKS: ${METADATA_RPC_TOKEN_FIREWORKS}
      METADATA_RPC_TOKEN_DEEPINFRA: ${METADATA_RPC_TOKEN_DEEPINFRA}
      METADATA_RPC_TOKEN_TINFOIL: ${METADATA_RPC_TOKEN_TINFOIL}
      METADATA_RPC_TOKEN_NEAR: ${METADATA_RPC_TOKEN_NEAR}
      METADATA_RPC_TOKEN_PHALA_AI: ${METADATA_RPC_TOKEN_PHALA_AI}
      CONTROL_METADATA_URL: http://control.anonrouter.internal:8444
      # The synchronizer is what keeps catalog_state.last_success_at
      # advancing. With it off the 15-minute freshness gate makes every
      # model ineligible and the API answers "Model not found", which reads
      # as an outage and is the gate working correctly.
      CATALOG_SYNC_ENABLED: "true"
      CATALOG_SYNC_INTERVAL_SECONDS: "300"
      # Credential administration terminates HERE, per provider. Capability
      # mode is the only mode this role boots in: installation needs a signed,
      # single-use, endpoint-bound authorization presented directly to the
      # attested workload.
      CREDENTIAL_ADMIN_MODE: capability
      CREDENTIAL_CAPABILITY_SIGNERS: ${CREDENTIAL_CAPABILITY_SIGNERS}
      CONTENT_TLS_SPKI_SHA256: ${CONTENT_TLS_SPKI_SHA256}
      # STATE CONTINUITY (review finding C5). The Venice worker's overlay path,
      # and the directory every per-provider worker keeps its replay log in.
      # The pool writes one log per provider there, under the filename that
      # provider's own worker uses (consumed-<compose key>.json), so a
      # capability consumed under either topology stays consumed under the
      # other. A missing log reads as "nothing consumed".
      VENICE_KEYSET_OVERLAY_FILE: /var/lib/anonrouter-worker/venice-keyset-overlay.json
      CONSUMED_CAPABILITY_DIR: /var/lib/anonrouter-worker
      # Release-authority lookups (GitHub, Base) are made FOR this process by
      # the release-collateral role. This process has no route to those hosts.
      RELEASE_COLLATERAL_RPC_URL: http://release-collateral:3000
      RELEASE_COLLATERAL_RPC_TOKEN: ${RELEASE_COLLATERAL_RPC_TOKEN}
      # UNMEASURED. A V8 heap cap, so the ceiling below is headroom for native
      # and socket memory instead of the only bound. The numbers are
      # placeholders; plan item W7 measures them.
      NODE_OPTIONS: --max-old-space-size=512 --max-semi-space-size=16
      # Deliberately NOT named after the variables config.ts reads a key from:
      # it rejects an ambiguous plain-variable + file combination. Each is
      # removed from the environment before the app starts.
      VENICE_KEY_B64: ${VENICE_KEY_B64}
      FIREWORKS_KEY_B64: ${FIREWORKS_KEY_B64}
      DEEPINFRA_KEY_B64: ${DEEPINFRA_KEY_B64}
      TINFOIL_KEY_B64: ${TINFOIL_KEY_B64}
      NEAR_KEY_B64: ${NEAR_KEY_B64}
      PHALA_AI_KEY_B64: ${PHALA_AI_KEY_B64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$VENICE_KEY_B64" | base64 -d > /tmp/venice-key
        printf '%s' "$$FIREWORKS_KEY_B64" | base64 -d > /tmp/fireworks-key
        printf '%s' "$$DEEPINFRA_KEY_B64" | base64 -d > /tmp/deepinfra-key
        printf '%s' "$$TINFOIL_KEY_B64" | base64 -d > /tmp/tinfoil-key
        printf '%s' "$$NEAR_KEY_B64" | base64 -d > /tmp/near-key
        printf '%s' "$$PHALA_AI_KEY_B64" | base64 -d > /tmp/phala-ai-key
        # Refuse to start rather than dispatch with an empty credential, for
        # any provider: a pool missing one key is not a smaller pool.
        test -s /tmp/venice-key
        test -s /tmp/fireworks-key
        test -s /tmp/deepinfra-key
        test -s /tmp/tinfoil-key
        test -s /tmp/near-key
        test -s /tmp/phala-ai-key
        unset VENICE_KEY_B64 FIREWORKS_KEY_B64 DEEPINFRA_KEY_B64 TINFOIL_KEY_B64 NEAR_KEY_B64 PHALA_AI_KEY_B64
        exec npm run start
    # Not before the volume below is this account's. See credential-state-init.
    depends_on:
      credential-state-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    volumes:
      # The only writable mount holding a secret, and this is the only service
      # that mounts it. Written atomically at mode 0600, never logged, and
      # encrypted by the dstack key provider, which releases the disk key only
      # to a TD whose measurements match this release.
      - credential-state:/var/lib/anonrouter-worker
    # UNMEASURED placeholder. See the header.
    mem_limit: 1024m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      # relay and edge reach it here. No other worker is on this network.
      - cvm-rpc-pool
      # Its only route out: pool-egress, and in this manifest the mock.
      - cvm-egress-pool
      # The release-collateral role, and nothing else.
      - cvm-release-collateral
      # Its OWN control lane, which the Bedrock worker is not on.
      - cvm-control-pool

  # ---------------------------------------------------------------------------
  # Bedrock. NOT POOLED: it signs with SigV4 under a short-lived workload
  # identity and holds no bearer key. UNCHANGED from the per-provider topology
  # except for its control lane, which is now its own.
  # ---------------------------------------------------------------------------
  bedrock-worker:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: bedrock-worker
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      BEDROCK_ENABLED: "true"
      BEDROCK_REGION: us-east-1
      # SigV4 credentials come from the AWS default chain. The rendered
      # config's [default] profile runs aws_signing_helper as a
      # credential_process, exchanging a SHORT-LIVED X.509 workload
      # certificate for temporary Roles Anywhere credentials.
      #
      # There is deliberately no AWS_ACCESS_KEY_ID here, and config.ts
      # fails closed if one appears in this role.
      AWS_CONFIG_FILE: /tmp/bedrock-aws-config
      # The SDK and the signing helper both look under $HOME, and the
      # rootfs is read-only, so point it at the tmpfs.
      HOME: /tmp
      # The three encrypted delivery values, DECLARED so they actually
      # reach the container.
      BEDROCK_AWS_CONFIG_B64: ${BEDROCK_AWS_CONFIG_B64}
      BEDROCK_WORKLOAD_CERT_B64: ${BEDROCK_WORKLOAD_CERT_B64}
      BEDROCK_WORKLOAD_KEY_B64: ${BEDROCK_WORKLOAD_KEY_B64}
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      CONFIDENTIAL_DEPLOYMENT_ID: us-west-1-prod5-xl
      # AR-02: this worker holds ONLY its own provider's metadata token.
      METADATA_RPC_TOKEN_BEDROCK: ${METADATA_RPC_TOKEN_BEDROCK}
      CONTROL_METADATA_URL: http://control.anonrouter.internal:8444
      CATALOG_SYNC_ENABLED: "true"
      CATALOG_SYNC_INTERVAL_SECONDS: "300"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$BEDROCK_AWS_CONFIG_B64" | base64 -d > /tmp/bedrock-aws-config
        printf '%s' "$$BEDROCK_WORKLOAD_CERT_B64" | base64 -d > /tmp/bedrock-workload.crt
        printf '%s' "$$BEDROCK_WORKLOAD_KEY_B64" | base64 -d > /tmp/bedrock-workload.key
        # Refuse to start rather than dispatch with no workload identity.
        test -s /tmp/bedrock-aws-config
        test -s /tmp/bedrock-workload.crt
        test -s /tmp/bedrock-workload.key
        unset BEDROCK_AWS_CONFIG_B64 BEDROCK_WORKLOAD_CERT_B64 BEDROCK_WORKLOAD_KEY_B64
        exec npm run start
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    mem_limit: 512m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - cvm-rpc-bedrock
      - cvm-egress-bedrock
      # Its OWN control lane, which the pool worker is not on. In the
      # per-provider topology this worker and every other shared one.
      - cvm-control-bedrock

  # ---------------------------------------------------------------------------
  # RELEASE-COLLATERAL. Makes the pool's release-authority lookups: what a
  # provider publishes on GitHub, and one registry on Base. It exists so the
  # process holding six providers' keys does not also hold open sessions to
  # hosts that accept writes.
  #
  # ITS ENVIRONMENT IS ITS ROLE AND ONE TOKEN. No shared anchor contributes a
  # variable: src/config.ts refuses to boot this role if it is handed any other
  # role's token, any metadata token, any credential-administration setting or
  # any provider credential (tests/unit/release-collateral-role-config.test.ts),
  # so a block that inherited the workers' settings would not start.
  #
  # No volume, no dstack socket, no entrypoint: there is nothing to decode, and
  # nothing it holds is written anywhere that survives a restart.
  # ---------------------------------------------------------------------------
  release-collateral:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:536e7fcb8be62ce027a764098f07237c1fdb282be9a71dc62334d75bcf08ce8d
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: release-collateral
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # Admits the pool to this role and to nothing else. The pool is the only
      # other holder.
      RELEASE_COLLATERAL_RPC_TOKEN: ${RELEASE_COLLATERAL_RPC_TOKEN}
      # UNMEASURED. A V8 heap cap; the numbers are placeholders that plan item
      # W7 measures.
      NODE_OPTIONS: --max-old-space-size=192 --max-semi-space-size=16
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    # UNMEASURED placeholder. See the header.
    mem_limit: 384m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      # The pool reaches it here. Nothing else is on this network.
      - cvm-release-collateral
      # Its only route out.
      - cvm-egress-release-collateral

  pool-egress:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-pool-egress@sha256:ed9bc042e224c1aafc031bf3697f87ee0a388878e97f991d7d613ad65bf4a7dc
    platform: linux/amd64
    cap_add:
      - NET_BIND_SERVICE
    user: "99:99"
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 96m
    networks:
      cvm-egress-pool:
        # The alias is what makes its client's DNS for these names land here
        # rather than on the Internet. TCP/SNI only: this proxy terminates
        # nothing and carries ciphertext end to end.
        aliases:
          - api.venice.ai
          - api.fireworks.ai
          - api.deepinfra.com
          - inference.tinfoil.sh
          - github-proxy.tinfoil.sh
          - kds-proxy.tinfoil.sh
          - cloud-api.near.ai
          - completions.near.ai
          - glm-5-3-flash.completions.near.ai
          - inference.phala.com
      cvm-internet: {}
    # SYNTHETIC RUN: no pool-worker setting in this manifest names a host this
    # proxy admits. It is present, with its production allowlist, so a capacity
    # measurement counts every container the production topology runs.

  bedrock-egress:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-bedrock-egress@sha256:afe32f755b3f9b784d480334dc8767f11c3222aaef3f3aeb10438ea3e0891f7b
    platform: linux/amd64
    cap_add:
      - NET_BIND_SERVICE
    user: "99:99"
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 96m
    networks:
      cvm-egress-bedrock:
        # The alias is what makes its client's DNS for these names land here
        # rather than on the Internet. TCP/SNI only: this proxy terminates
        # nothing and carries ciphertext end to end.
        aliases:
          - bedrock-mantle.us-east-1.api.aws
          - rolesanywhere.us-east-1.amazonaws.com
      cvm-internet: {}
    # SYNTHETIC RUN: idle. It is present so the capacity measurement counts every
    # container the production topology runs; a headroom number taken without it
    # would be a fiction.

  release-collateral-egress:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-release-collateral-egress@sha256:22aa331178e530f62da3ed1aa4718449a9012376bf464f573d032274f7f01247
    platform: linux/amd64
    cap_add:
      - NET_BIND_SERVICE
    user: "99:99"
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 96m
    networks:
      cvm-egress-release-collateral:
        # The alias is what makes its client's DNS for these names land here
        # rather than on the Internet. TCP/SNI only: this proxy terminates
        # nothing and carries ciphertext end to end.
        aliases:
          - github.com
          - raw.githubusercontent.com
          - api.github.com
          - mainnet.base.org
          - base-rpc.publicnode.com
      cvm-internet: {}

  # ---------------------------------------------------------------------------
  # THE MOCK PROVIDER. ITS PRESENCE MAKES THIS FILE A PREPRODUCTION MANIFEST AND
  # NOTHING ELSE.
  #
  # It selects behaviour from the MODEL NAME, so no extra configuration is
  # measured: `-fail` returns 502, `-slow` delays past any deadline,
  # `-interrupt` drops mid-stream. It fragments tool-call arguments off JSON
  # boundaries on purpose, and it never echoes the prompt, so a privacy canary
  # cannot come back out of the provider and mask a real leak.
  # ---------------------------------------------------------------------------
  mock-provider:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-mock-provider@sha256:7a9a6997f8084f90d26d1a45cc89b87f9aad95daa95509142e12948e3707b8c1
    platform: linux/amd64
    command: ["node", "/srv/mock-provider.mjs"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Reachable from the pool worker's egress network and nowhere else. It has
    # no Internet route.
    networks:
      - cvm-egress-pool

volumes:
  # ACME account/certificate state and the public attestation bundle persist on
  # the CVM's encrypted disk across restarts.
  cert-data:
  evidences:
  # The Venice keyset overlay and every pooled provider's consumed-capability
  # log. THE SAME VOLUME the per-provider workers mount, under the same name,
  # so the pool finds their state and they find the pool's. Encrypted by the
  # dstack key provider, which releases the key only to a TD whose measurements
  # match this release.
  credential-state:

networks:
  # EVERY NETWORK HAS AN EXPLICIT SUBNET from 10.231.0.0/16, assigned by name in
  # the generator's NETWORK_SUBNETS table, so this file takes nothing from
  # Docker's default address pools. An in-place update over the per-provider
  # topology leaves that topology's networks behind, and the default pools
  # (31, docker0 included) ran out on a real CVM (POOL_CVM_TEST_RESULTS.md).
  cvm-edge:
    internal: true
    ipam:
      config:
        - subnet: 10.231.1.0/24
  cvm-relay:
    internal: true
    ipam:
      config:
        - subnet: 10.231.2.0/24
  cvm-compat:
    internal: true
    ipam:
      config:
        - subnet: 10.231.3.0/24
  cvm-attest:
    internal: true
    ipam:
      config:
        - subnet: 10.231.4.0/24
  # ONE RPC NETWORK PER WORKER. relay and edge join both; each worker joins
  # only its own.
  cvm-rpc-pool:
    internal: true
    ipam:
      config:
        - subnet: 10.231.10.0/24
  cvm-rpc-bedrock:
    internal: true
    ipam:
      config:
        - subnet: 10.231.11.0/24
  # ONE EGRESS NETWORK PER CLIENT. Internal, so the client has no default
  # route: everything it sends leaves through a proxy that admits exactly the
  # names baked into that proxy's image.
  cvm-egress-pool:
    internal: true
    ipam:
      config:
        - subnet: 10.231.20.0/24
  cvm-egress-bedrock:
    internal: true
    ipam:
      config:
        - subnet: 10.231.21.0/24
  cvm-egress-release-collateral:
    internal: true
    ipam:
      config:
        - subnet: 10.231.22.0/24
  # The pool worker and the release-collateral role, and nothing else.
  cvm-release-collateral:
    internal: true
    ipam:
      config:
        - subnet: 10.231.30.0/24
  # ONE CONTROL LANE PER CONSUMER, each holding that consumer and the control
  # proxy. This replaces the single cvm-control-egress of the per-provider
  # topology, which every worker, the relay and compat all joined.
  cvm-control-relay:
    internal: true
    ipam:
      config:
        - subnet: 10.231.40.0/24
  cvm-control-compat:
    internal: true
    ipam:
      config:
        - subnet: 10.231.41.0/24
  cvm-control-pool:
    internal: true
    ipam:
      config:
        - subnet: 10.231.42.0/24
  cvm-control-bedrock:
    internal: true
    ipam:
      config:
        - subnet: 10.231.43.0/24
  # The routable network. Attached ONLY to dstack-ingress, the control proxy and
  # the three SNI egress proxies. No relay, compat broker, worker or
  # release-collateral role joins it.
  cvm-internet:
    ipam:
      config:
        - subnet: 10.231.100.0/24
