# SNI allowlist: the release-collateral service's ONLY route out.
#
# Allowed: github.com, raw.githubusercontent.com, api.github.com, mainnet.base.org, base-rpc.publicnode.com. Everything else is dropped, because there is no
# default backend -- a worker that has been made to resolve something else must
# get nowhere, not somewhere.
#
# TCP mode, so this gateway carries ciphertext and terminates nothing. It learns
# the SNI hostname; it cannot read a prompt, a response, or a credential.
#
# resolve-prefer ipv4 is load-bearing: the container networks are IPv4-only, and
# picking an AAAA record fails with "no free ports", a message about source-port
# exhaustion that says nothing about address families.
#
# GENERATED by deploy/phala/gen-provider-egress.mjs. Do not hand-edit.
global
  log stdout format raw local0 info
  maxconn 2048

defaults
  mode tcp
  timeout connect 10s
  timeout client 620s
  timeout server 620s

resolvers publicdns
  nameserver cloudflare 1.1.1.1:53
  nameserver google 8.8.8.8:53
  hold valid 30s

frontend release-collateral_sni
  bind *:443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  acl allow_github_com req.ssl_sni -i github.com
  acl allow_raw_githubusercontent_com req.ssl_sni -i raw.githubusercontent.com
  acl allow_api_github_com req.ssl_sni -i api.github.com
  acl allow_mainnet_base_org req.ssl_sni -i mainnet.base.org
  acl allow_base_rpc_publicnode_com req.ssl_sni -i base-rpc.publicnode.com
  use_backend github_com if allow_github_com
  use_backend raw_githubusercontent_com if allow_raw_githubusercontent_com
  use_backend api_github_com if allow_api_github_com
  use_backend mainnet_base_org if allow_mainnet_base_org
  use_backend base_rpc_publicnode_com if allow_base_rpc_publicnode_com

backend github_com
  server upstream github.com:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend raw_githubusercontent_com
  server upstream raw.githubusercontent.com:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend api_github_com
  server upstream api.github.com:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend mainnet_base_org
  server upstream mainnet.base.org:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend base_rpc_publicnode_com
  server upstream base-rpc.publicnode.com:443 resolvers publicdns init-addr none resolve-prefer ipv4
