# SNI allowlist: the pool-worker's ONLY route out.
#
# Allowed: api.venice.ai, api.fireworks.ai, api.deepinfra.com, inference.tinfoil.sh, github-proxy.tinfoil.sh, kds-proxy.tinfoil.sh, cloud-api.near.ai, completions.near.ai, glm-5-3-flash.completions.near.ai, inference.phala.com. Everything else is dropped, because there is no
# default backend -- a worker that has been made to resolve something else must
# get nowhere, not somewhere.
#
# TCP mode, so this gateway carries ciphertext and terminates nothing. It learns
# the SNI hostname; it cannot read a prompt, a response, or a credential.
#
# resolve-prefer ipv4 is load-bearing: the container networks are IPv4-only, and
# picking an AAAA record fails with "no free ports", a message about source-port
# exhaustion that says nothing about address families.
#
# GENERATED by deploy/phala/gen-provider-egress.mjs. Do not hand-edit.
global
  log stdout format raw local0 info
  maxconn 2048

defaults
  mode tcp
  timeout connect 10s
  timeout client 620s
  timeout server 620s

resolvers publicdns
  nameserver cloudflare 1.1.1.1:53
  nameserver google 8.8.8.8:53
  hold valid 30s

frontend pool_sni
  bind *:443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  acl allow_api_venice_ai req.ssl_sni -i api.venice.ai
  acl allow_api_fireworks_ai req.ssl_sni -i api.fireworks.ai
  acl allow_api_deepinfra_com req.ssl_sni -i api.deepinfra.com
  acl allow_inference_tinfoil_sh req.ssl_sni -i inference.tinfoil.sh
  acl allow_github_proxy_tinfoil_sh req.ssl_sni -i github-proxy.tinfoil.sh
  acl allow_kds_proxy_tinfoil_sh req.ssl_sni -i kds-proxy.tinfoil.sh
  acl allow_cloud_api_near_ai req.ssl_sni -i cloud-api.near.ai
  acl allow_completions_near_ai req.ssl_sni -i completions.near.ai
  acl allow_glm_5_3_flash_completions_near_ai req.ssl_sni -i glm-5-3-flash.completions.near.ai
  acl allow_inference_phala_com req.ssl_sni -i inference.phala.com
  use_backend api_venice_ai if allow_api_venice_ai
  use_backend api_fireworks_ai if allow_api_fireworks_ai
  use_backend api_deepinfra_com if allow_api_deepinfra_com
  use_backend inference_tinfoil_sh if allow_inference_tinfoil_sh
  use_backend github_proxy_tinfoil_sh if allow_github_proxy_tinfoil_sh
  use_backend kds_proxy_tinfoil_sh if allow_kds_proxy_tinfoil_sh
  use_backend cloud_api_near_ai if allow_cloud_api_near_ai
  use_backend completions_near_ai if allow_completions_near_ai
  use_backend glm_5_3_flash_completions_near_ai if allow_glm_5_3_flash_completions_near_ai
  use_backend inference_phala_com if allow_inference_phala_com

backend api_venice_ai
  server upstream api.venice.ai:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend api_fireworks_ai
  server upstream api.fireworks.ai:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend api_deepinfra_com
  server upstream api.deepinfra.com:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend inference_tinfoil_sh
  server upstream inference.tinfoil.sh:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend github_proxy_tinfoil_sh
  server upstream github-proxy.tinfoil.sh:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend kds_proxy_tinfoil_sh
  server upstream kds-proxy.tinfoil.sh:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend cloud_api_near_ai
  server upstream cloud-api.near.ai:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend completions_near_ai
  server upstream completions.near.ai:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend glm_5_3_flash_completions_near_ai
  server upstream glm-5-3-flash.completions.near.ai:443 resolvers publicdns init-addr none resolve-prefer ipv4

backend inference_phala_com
  server upstream inference.phala.com:443 resolvers publicdns init-addr none resolve-prefer ipv4
