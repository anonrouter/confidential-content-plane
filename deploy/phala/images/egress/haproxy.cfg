# mTLS client for the production-isolated control bridge on Hetzner. The
# bridge is a separate proxy process with no database or Valkey access; it
# maps deployment-scoped TEE credentials to the existing control service and never
# receives prompt/response content.
#
# HTTP mode rather than SNI passthrough, because originating a mutually
# authenticated connection means terminating the relay's plain-HTTP
# request here and making a new TLS one outward with a client certificate.
#
# This file is the reviewed source baked into the digest-pinned image.
global
  log stdout format raw local0 notice
  maxconn 512
  # Refuse anything below TLS 1.2 outright.
  ssl-default-server-options ssl-min-ver TLSv1.2

defaults
  mode http
  log global
  # Log errors only. A normal request line is content-free, but the fewer
  # surfaces that write anything per request, the fewer to audit.
  option dontlog-normal
  # Never capture headers: Authorization must not reach any log.
  option http-ignore-probes
  timeout connect 10s
  timeout client 620s
  timeout server 620s

resolvers publicdns
  nameserver cloudflare 1.1.1.1:53
  nameserver google 8.8.8.8:53
  hold valid 30s

frontend control_in
  bind *:8444
  # Bound a failed-client loop without limiting the initial production target.
  maxconn 128

  # Defence in depth over Caddy's allowlist. The eleven control routes the
  # relay calls, plus the two metadata routes the worker needs, listed
  # individually so a control RPC added later is not silently reachable.
  acl control_route path /internal/compat/mint /internal/control/abort /internal/control/attestation-attempt /internal/control/attestation-redeem /internal/control/authorize /internal/control/authorize-next-attempt /internal/control/capture /internal/control/catalog /internal/control/delivery-started /internal/control/dispatch-attempt /internal/control/models /internal/control/provider-rejection /internal/control/redeem /internal/control/settle
  http-request deny deny_status 404 unless METH_POST
  http-request deny deny_status 404 unless control_route
  # The application addresses this sidecar by its measured, private network
  # alias (control.anonrouter.internal). Caddy deliberately enables strict SNI/Host
  # matching when client-auth TLS is active, so forwarding that private Host
  # makes an otherwise valid mTLS request fail with 421. Bind the HTTP Host to
  # the same public name whose certificate and SNI we verify below. This is a
  # fixed measured literal, not a caller-controlled forwarding header.
  http-request set-header Host api.anonrouter.ai:8444
  default_backend control
  # resolve-prefer ipv4 is load-bearing. The relay host publishes both A and
  # AAAA records; HAProxy picked the AAAA, and the container networks here are
  # IPv4-only, so every connection failed with "Connect() failed for backend
  # control: no free ports." That message describes source-port exhaustion and
  # says nothing about address families, which cost an hour of looking in the
  # wrong place.

backend control
  # crt presents OUR client certificate; ca-file verifies THEIRS against
  # the offline AnonRouter control-bridge CA. Pinning to a single
  # private CA is STRONGER than the public roots here: only one issuer can
  # produce a certificate this client will accept. verify required means a
  # bad server certificate fails the connection rather than warning.
  server control api.anonrouter.ai:8444 ssl crt /tmp/tee-control-client.pem ca-file /usr/local/etc/haproxy/control-ca.crt verify required sni str(api.anonrouter.ai) resolvers publicdns init-addr none resolve-prefer ipv4
