volumes:
  # ACME account/certificate state and the public attestation bundle persist on
  # the CVM's encrypted disk across restarts.
  cert-data:
  evidences:
  # Every worker's credential overlay and consumed-capability log. Encrypted by
  # the dstack key provider, which releases the key only to a TD whose
  # measurements match this release.
  credential-state:

networks:
  cvm-edge:
    internal: true
  cvm-relay:
    internal: true
  cvm-compat:
    internal: true
  cvm-attest:
    internal: true
  # ONE RPC NETWORK PER WORKER. relay joins all seven; each worker joins only
  # its own, so a compromised worker cannot reach a peer's socket.
  cvm-rpc-venice:
    internal: true
  cvm-rpc-fireworks:
    internal: true
  cvm-rpc-deepinfra:
    internal: true
  cvm-rpc-chutes:
    internal: true
  cvm-rpc-tinfoil:
    internal: true
  cvm-rpc-near:
    internal: true
  cvm-rpc-phala-ai:
    internal: true
  cvm-rpc-bedrock:
    internal: true
  # ONE EGRESS NETWORK PER WORKER. Internal, so the worker itself has no default
  # route: everything it sends leaves through a proxy that accepts exactly its
  # own provider's names.
  cvm-egress-venice:
    internal: true
  cvm-egress-fireworks:
    internal: true
  cvm-egress-deepinfra:
    internal: true
  cvm-egress-chutes:
    internal: true
  cvm-egress-tinfoil:
    internal: true
  cvm-egress-near:
    internal: true
  cvm-egress-phala-ai:
    internal: true
  cvm-egress-bedrock:
    internal: true
  cvm-control-egress:
    internal: true
  # The routable network. Attached ONLY to dstack-ingress and the eight narrow
  # egress sidecars. No relay, compat broker, or worker joins it.
  cvm-internet: {}
