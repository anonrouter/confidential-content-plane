    image: ghcr.io/anonrouter/confidential-content-plane@sha256:8b29ae96bb38850430d74501351156addba345bef72e6da29e1394e35ded7569
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: bedrock-worker
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      BEDROCK_ENABLED: "true"
      BEDROCK_REGION: us-east-1
      # SigV4 credentials come from the AWS default chain. The rendered
      # config's [default] profile runs aws_signing_helper as a
      # credential_process, exchanging a SHORT-LIVED X.509 workload
      # certificate for temporary Roles Anywhere credentials.
      #
      # There is deliberately no AWS_ACCESS_KEY_ID here, and config.ts
      # fails closed if one appears in this role. The static session keys
      # that exist for local development EXPIRED on 2026-08-02 and must
      # never be persisted into a measured release.
      AWS_CONFIG_FILE: /tmp/bedrock-aws-config
      # The SDK and the signing helper both look under $HOME, and the
      # rootfs is read-only, so point it at the tmpfs.
      HOME: /tmp
      # The three encrypted delivery values, DECLARED so they actually
      # reach the container. Omitting these while the entrypoint still
      # referenced them meant the workload identity arrived empty, the
      # entrypoint's own "test -s" refused to start, and the worker sat in
      # a restart loop while every other provider looked healthy.
      BEDROCK_AWS_CONFIG_B64: ${BEDROCK_AWS_CONFIG_B64}
      BEDROCK_WORKLOAD_CERT_B64: ${BEDROCK_WORKLOAD_CERT_B64}
      BEDROCK_WORKLOAD_KEY_B64: ${BEDROCK_WORKLOAD_KEY_B64}
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      CONFIDENTIAL_DEPLOYMENT_ID: us-west-1-prod5-xl
      # AR-02: this worker holds ONLY its own provider's metadata token, so
      # a compromised worker cannot push another provider's catalog.
      METADATA_RPC_TOKEN_BEDROCK: ${METADATA_RPC_TOKEN_BEDROCK}
      CONTROL_METADATA_URL: http://control.anonrouter.internal:8444
      # The synchronizer is what keeps catalog_state.last_success_at
      # advancing. With it off the 15-minute freshness gate makes every
      # model ineligible and the API answers "Model not found", which reads
      # as an outage and is the gate working correctly.
      CATALOG_SYNC_ENABLED: "true"
      CATALOG_SYNC_INTERVAL_SECONDS: "300"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$BEDROCK_AWS_CONFIG_B64" | base64 -d > /tmp/bedrock-aws-config
        printf '%s' "$$BEDROCK_WORKLOAD_CERT_B64" | base64 -d > /tmp/bedrock-workload.crt
        printf '%s' "$$BEDROCK_WORKLOAD_KEY_B64" | base64 -d > /tmp/bedrock-workload.key
        # Refuse to start rather than dispatch with no workload identity.
        test -s /tmp/bedrock-aws-config
        test -s /tmp/bedrock-workload.crt
        test -s /tmp/bedrock-workload.key
        unset BEDROCK_AWS_CONFIG_B64 BEDROCK_WORKLOAD_CERT_B64 BEDROCK_WORKLOAD_KEY_B64
        exec npm run start
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    mem_limit: 512m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      # Its OWN rpc network, not a shared one. A compromised worker cannot
      # reach a peer worker's socket at all, which matters because
      # WORKER_RPC_TOKEN is a single shared value across workers.
      - cvm-rpc-bedrock
      - cvm-egress-bedrock
      - cvm-control-egress

  venice-egress:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-venice-egress@sha256:aca6ea1550b45c48994cab86518b77107eac51928466470c3a34bbdc5c32ed6d
    platform: linux/amd64
    cap_add:
      - NET_BIND_SERVICE
    user: "99:99"
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 96m
    networks:
      cvm-egress-venice:
        # The alias is what makes the worker's DNS for its provider land here
        # rather than on the Internet. TCP/SNI only: this proxy terminates
        # nothing and carries ciphertext end to end.
        aliases:
          - api.venice.ai
          - github.com
          - raw.githubusercontent.com
          - api.github.com
          - mainnet.base.org
          - base-rpc.publicnode.com
      cvm-internet: {}

