# AnonRouter confidential content plane: PROD5 (US-WEST-1, node 26), tdx.large.
# PRODUCTION MANIFEST.
#
# ============================ REBUILD REQUIRED ==============================
#
# 1 image(s) pinned below were built from source this tree has moved
# past. This compose is NOT deployable as it stands: deploying it would ship the
# previous behaviour under a new release id, and every measurement would agree,
# because the measurement is of the compose and the compose is what was
# reviewed.
#
# WHAT AN ENTRY ASSERTS, AND WHAT IT DOES NOT. Each one is a BUILD fact: a
# declared input moved after the digest was published, so a rebuild produces
# different bytes. Whether the running roles BEHAVE differently is a separate
# question this check does not answer and cannot. "We looked and the change is
# behaviourally inert" is a reason to rebuild and repin cheaply. It is never a
# reason to deploy the stale digest, because the next reader inherits the
# judgement and not the evidence for it.
#
#   ghcr.io/anonrouter/confidential-content-plane
#     32 declared input(s) moved since 56096d0 (scripts/export-content-plane.ts,
#     src/config.ts, src/contentPlane.ts, src/logger.ts,
#     src/providers/attestation/authority/collateral.ts,
#     src/providers/attestation/authority/dstackOnchain.ts,
#     src/providers/catalog/chutesSync.ts,
#     src/providers/catalog/deepinfraSync.ts, …); Re-export with `npx tsx
#     scripts/export-content-plane.ts <dir>`, publish and sign the image from
#     the public repository, then move resolvedDigest, tag and sourceCommit
#     together in this contract and repin the digest in
#     gen-prod5-xl-compose.mjs, in the SAME change, and regenerate the composes.
#     Do NOT narrow the input set to make this pass: the closure is derived from
#     src/contentPlane.ts, so narrowing it means describing an image that is not
#     the one being built.
#
# deploy/phala/production-preflight.sh FAILS while this block is present. Clear
# it by rebuilding each image and repinning its digest in the SAME change, then
# regenerate this file.
# ============================================================================
#
# GENERATED by deploy/phala/gen-prod5-xl-compose.mjs. Do not hand-edit:
# 8 workers and 8 egress proxies differ only in a name, a URL and a
# credential variable, and the one mistake that matters is a worker wired to
# another provider's route. The generator's table is the single source of truth.
#
# WHAT THIS REPLACES. The tdx.medium launch shipped ONE provider because seven
# workers plus their egress proxies did not fit in 4 GB. Production now runs on
# 4 vCPU / 8 GB with measured headroom, so every provider the product advertises as
# confidential now keeps prompts and responses inside an attested content-plane
# CVM until provider egress. No advertised provider is left on a plaintext
# conventional path while being described as confidential.
#
# THE MEASURED BUDGET, which is the whole reason this file exists:
#
#   ingress 192m + edge 96m + relay 1536m + compat 768m + attest 384m
#   + control-egress 96m
#   + 8 workers (venice 512m, fireworks 512m, deepinfra 512m, chutes 512m, tinfoil 512m, near 512m, phala-ai 384m, bedrock 512m)
#   + 8 egress x 96m
#   = 7808 MB capped: 47.7% of an xlarge (16384 MB),
#     104.1% of the large production now runs on (7503 MB MemTotal).
#
# THE SUM OF CEILINGS EXCEEDS LARGE's PHYSICAL RAM, and saying so plainly is the
# point. That is a PRE-EXISTING condition, not something the phala-ai worker
# introduced: seven workers already summed to 7,328 MB against 7,503 MB (97.7%).
# A ceiling is not a reservation, so this is legal and normal, and what actually
# governs is MEASURED footprint: production reports about 2.2 GiB used with
# 5.28 GiB free, and the phala-ai worker + egress measured 237.3 + 32.8 MiB at
# 128-way concurrency. See docs/operations/handoffs/2026-09-03-phala-ai-provider.md
# for the arithmetic and the disable threshold that backs it.
#
# Unlike the medium file, ingress is CAPPED here. Leaving it uncapped was the
# reason the medium's "1,696 MB of headroom" was an upper bound on paper rather
# than a measurement.
#
# ISOLATION, stated precisely rather than implied:
#
#   - Each worker holds exactly ONE provider credential and reaches exactly one
#     upstream, named as a literal, through an SNI-allowlisted proxy.
#   - Each worker has its OWN rpc network. WORKER_RPC_TOKEN is a single shared
#     value across workers, so network reachability is what actually separates
#     them; a shared rpc network would leave one compromised worker able to
#     drive another. This is recorded as a residual property, not solved.
#   - Each worker holds only its own metadata token (AR-02).
#   - GCP/control receives no provider credential and no content. What crosses
#     the bridge is the fixed content-free allowlist in CONTROL_RPC_CONTRACT.md.
#
# PRODUCTION. No mock provider: a manifest containing one leaves a verifier
# unable to tell which upstream answered a request.
#
# Deploy on the production OS image (--image dstack-0.5.9). SSH is unavailable
# there; container health is established from attestation evidence and external
# behaviour, never by reaching inside the CVM.

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "2"

services:

  # ---------------------------------------------------------------------------
  # dstack-ingress: the customer's TLS terminates HERE, inside the TD. Phala's
  # external gateway forwards raw TCP for the custom domain and never receives
  # the private key, the session keys, or a byte of plaintext.
  #
  # MULTI-DOMAIN, AND EVERY NAME IS MEASURED. 2 names:
  #   api.anonrouter.ai
  #   api.private.anonrouter.ai
  #
  # Upstream issues a SEPARATE certificate per name and selects it by SNI, so
  # each name has its own key and its own SPKI. That is why the attestation
  # producer binds the origin the caller actually connected to and observes THAT
  # name's certificate, rather than assuming one key covers the deployment. See
  # src/gateway/service.ts.
  #
  # THE IMAGE MOVED 2.2 -> 2.3 AND THE REASON IS THIS FEATURE. 2.2 is
  # single-domain; `DOMAINS`/`ROUTING_MAP` are what make one attested workload
  # serve the restored api.anonrouter.ai base URL AND keep the launch origin
  # api.private.anonrouter.ai as a verification alias. The tag-to-digest mapping
  # below was resolved read-only against the live registry and agrees with the
  # digest upstream's own README names at the commit this project pins in
  # .evidence/public-content-plane-export/dstack-ingress-source-pin.json.
  #
  # It also CLOSES a provenance gap rather than opening one: that source pin is
  # dated after 2.2 was published, so the running image was already older than
  # the bytes this project reviewed. THIRD_PARTY_PROVENANCE.md records that as an
  # open item; 2.3 is the image the pinned tree describes.
  ingress:
    # Production derives from the reviewed upstream digest and adds one exact
    # Route53 CNAME after upstream's own scoped-role bootstrap. Preproduction
    # uses upstream directly and can never mutate the production alias.
    image: ghcr.io/anonrouter/anonrouter-dstack-ingress@sha256:bb6fbf4f89b1f12442c2ae0cbb3f640562fa7362adc6c7ef2bb3d898c02906bd
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      DNS_PROVIDER: route53
      # No DOMAIN and no TARGET_ENDPOINT: upstream treats single-domain and
      # multi-domain as mutually exclusive branches, and a leftover DOMAIN would
      # add a name to the certificate list with no backend behind it.
      DOMAINS: |
        api.anonrouter.ai
        api.private.anonrouter.ai
      ROUTING_MAP: |
        api.anonrouter.ai=edge:8080
        api.private.anonrouter.ai=edge:8080
      # The upstream manual hook writes each challenge under this measured,
      # Route-53-hosted suffix. The public CNAME is owner-managed in Namecheap;
      # the production image creates the private alias CNAME after assuming the
      # existing scoped Route53 role.
      DELEGATION_ZONE: public-api.private.anonrouter.ai
      GATEWAY_DOMAIN: _.${DSTACK_GATEWAY_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # The delegated target is a CNAME, and Route53 forbids a CAA record at
      # the same name. Production uses the zone ancestor's existing
      # letsencrypt.org authorization; the derived image makes this flag
      # effective in delegated mode. Synthetic keeps upstream's default.
      SET_CAA: "false"
      AWS_ROLE_ARN: ${ACME_ROUTE53_ROLE_ARN}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${ACME_ROUTE53_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${ACME_ROUTE53_SECRET_ACCESS_KEY}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
      - evidences:/evidences
    # CAPPED, unlike the medium file where this was the uncounted container.
    mem_limit: 192m
    networks:
      - cvm-edge
      - cvm-internet

  edge:
    <<: *hardened
    # edge-XL, not the single-provider edge. The difference is the credential
    # administration block: the medium's edge proxied EVERY credential route to
    # venice-worker as a literal, which with seven workers would deliver every
    # provider's secret to the Venice worker, silently, because the request
    # would succeed. This image routes /v1/credentials/<provider>/... to that
    # provider's own worker, one exact match at a time, with no wildcard backend.
    image: ghcr.io/anonrouter/anonrouter-edge-ingress-xl@sha256:eee182b6caf1452a023a169fb54c027f5bd4878adb5c3dd870ebae9041211b10
    platform: linux/amd64
    volumes:
      - evidences:/evidences:ro
    tmpfs:
      - /tmp:size=16m,nosuid,nodev
      - /config:size=8m,nosuid,nodev
      - /data:size=8m,nosuid,nodev
    mem_limit: 96m
    networks:
      - cvm-edge
      - cvm-relay
      - cvm-attest
      - cvm-compat
      # AND EVERY WORKER'S RPC NETWORK, which the single-provider edge was
      # missing. It routes /v1/credentials/<provider>/* to <provider>-worker:3000
      # but had no network path to any worker, so the credential-administration
      # flow that PROD5_TOPOLOGY.md describes as the launch mechanism answered
      # 502 on every request and always had -- on the medium too. The route
      # existed and the worker served it; nothing connected them.
      #
      # This does NOT reconnect the workers to each other. Each worker is still
      # only on its own rpc network; the edge bridges them at L7 exactly as the
      # relay already does, and neither forwards arbitrary traffic.
      - cvm-rpc-venice
      - cvm-rpc-fireworks
      - cvm-rpc-deepinfra
      - cvm-rpc-chutes
      - cvm-rpc-tinfoil
      - cvm-rpc-near
      - cvm-rpc-phala-ai
      - cvm-rpc-bedrock

  # ---------------------------------------------------------------------------
  # The content tier. Holds prompts and responses transiently in memory and
  # writes neither. No database, no Valkey, no account identity, no provider
  # credential, and no routable network.
  # ---------------------------------------------------------------------------
  relay:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:8b29ae96bb38850430d74501351156addba345bef72e6da29e1394e35ded7569
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: relay
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN}
      ALLOW_INLINE_TICKET: "false"
      # Media is an explicit measured production posture. Both values must
      # match the GCP control roles: relay handles plaintext only inside this
      # TD, while control performs content-free authorization and settlement.
      IMAGE_GENERATION_ENABLED: "true"
      SPEECH_GENERATION_ENABLED: "true"
      # /auto classifies and selects entirely inside this TD. The image bakes the
      # embedding model and fixes ROUTER_ALLOW_REMOTE_MODELS=false, so enabling
      # this does not add an egress path or disclose classifier output to GCP.
      # The relay cap is 1536 MB and the whole compose remains below the 70%
      # machine-budget ceiling asserted by prod5-xl-topology.test.ts.
      ROUTER_ENABLED: "true"
      # The generic 100 ms default predates the in-TD embedding classifier and
      # is shorter than real ONNX inference. Keep the request bounded, but give
      # the local offline model enough time to initialize and classify.
      ROUTER_TIMEOUT_MS: "5000"
      REQUEST_BODY_LIMIT_BYTES: "10000000"
      CONTROL_RPC_URL: http://control.anonrouter.internal:8444
      WORKER_RPC_URL: http://venice-worker:3000
      FIREWORKS_WORKER_RPC_URL: http://fireworks-worker:3000
      DEEPINFRA_WORKER_RPC_URL: http://deepinfra-worker:3000
      CHUTES_WORKER_RPC_URL: http://chutes-worker:3000
      TINFOIL_WORKER_RPC_URL: http://tinfoil-worker:3000
      NEAR_WORKER_RPC_URL: http://near-worker:3000
      PHALA-AI_WORKER_RPC_URL: http://phala-ai-worker:3000
      BEDROCK_WORKER_RPC_URL: http://bedrock-worker:3000
      RELAY_RPC_TOKEN: ${RELAY_RPC_TOKEN}
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      COMPAT_RPC_TOKEN: ${COMPAT_RPC_TOKEN}
      ALLOW_COMPAT_MODE: "true"
      # WAN deadlines. The measured control RTT is ~154 ms, so same-host
      # defaults would expire mid-request.
      CONTROL_RPC_TIMEOUT_MS: "15000"
      WORKER_RPC_TIMEOUT_MS: "620000"
      GATEWAY_ATTESTATION_ENABLED: "false"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    # Raised from the medium's 768m for seven-worker fanout plus the in-TD
    # embedding classifier used by /auto.
    mem_limit: 1536m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - cvm-relay
      - cvm-rpc-venice
      - cvm-rpc-fireworks
      - cvm-rpc-deepinfra
      - cvm-rpc-chutes
      - cvm-rpc-tinfoil
      - cvm-rpc-near
      - cvm-rpc-phala-ai
      - cvm-rpc-bedrock
      - cvm-control-egress

  # ---------------------------------------------------------------------------
  # OpenAI-compatibility broker. ONE public endpoint, as required. It sees
  # plaintext, which is why it lives inside the TD. It holds no provider
  # credential and no database.
  # ---------------------------------------------------------------------------
  compat:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:8b29ae96bb38850430d74501351156addba345bef72e6da29e1394e35ded7569
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: compat
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN}
      ALLOW_COMPAT_MODE: "true"
      COMPAT_RPC_TOKEN: ${COMPAT_RPC_TOKEN}
      CONTROL_RPC_URL: http://control.anonrouter.internal:8444
      RELAY_INGRESS_URL: http://relay:3000
      CONTROL_RPC_TIMEOUT_MS: "15000"
      RELAY_FORWARD_TIMEOUT_MS: "650000"
      GATEWAY_ATTESTATION_ENABLED: "false"
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    mem_limit: 768m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - cvm-compat
      - cvm-relay
      - cvm-control-egress

  # ---------------------------------------------------------------------------
  # Gateway attestation. The ONLY service mounting the dstack socket, separate
  # precisely so the relay does not hold an app-wide key oracle: anything that
  # reaches the socket can derive every key the app uses and mint a quote over
  # arbitrary report data.
  # ---------------------------------------------------------------------------
  attest:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:8b29ae96bb38850430d74501351156addba345bef72e6da29e1394e35ded7569
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: gateway-attestation
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN}
      GATEWAY_ATTESTATION_ENABLED: "true"
      # MEASURED LITERALS, canonical first, and the same list the ingress serves.
      #
      # This used to be a substitution of the GATEWAY_PUBLIC_ORIGIN environment
      # variable: an operator-supplied value bound into report_data. That let a
      # deployment attest to an origin the TD does not serve, with no measurement
      # contradicting it -- the client-side policy was the only thing standing in
      # the way. It is a literal now, so the origins this TD may claim are part
      # of the compose hash. (Written without the dollar-brace form on purpose:
      # a variable reference inside a comment is still a variable reference to
      # anything that interpolates the file as text, and an unset name there has
      # already blocked one release.)
      #
      # The attestation producer binds ONE of these per document: the one whose
      # host matches the caller's connection, falling back to the canonical
      # first entry. It observes that name's certificate for the SPKI, because
      # dstack-ingress issues one certificate per name.
      GATEWAY_PUBLIC_ORIGIN: https://api.anonrouter.ai,https://api.private.anonrouter.ai
      GATEWAY_RELEASE_ID: ${GATEWAY_RELEASE_ID}
      # A MEASURED LITERAL. An unmeasured switch that turns on a privacy claim
      # is worth nothing.
      GATEWAY_TRANSPORT: in-tee-tls
      # The address attest completes a REAL handshake against, so the SPKI it
      # publishes is the one actually served. There is deliberately no way to
      # hand it a fingerprint: completing a handshake requires the private key,
      # so observing one is proof of possession rather than a claim of it.
      GATEWAY_TLS_TERMINATOR: ingress:443
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - cvm-attest
      - cvm-edge

  # ---------------------------------------------------------------------------
  # The content tier's only route to GCP control, originating mTLS. What crosses
  # is content-free authorization metadata whose field set is pinned by
  # tests/unit/rpc-boundary-contract.test.ts.
  # ---------------------------------------------------------------------------
  control-egress:
    <<: *hardened
    image: ghcr.io/anonrouter/anonrouter-control-egress-gcp@sha256:9b6d16d8d76a59a8bbd0359f3647b13cd2db53ad3b480f35034ce32e7adf6812
    platform: linux/amd64
    cap_add:
      - NET_BIND_SERVICE
    user: "99:99"
    environment:
      TEE_CONTROL_CLIENT_PEM_B64: ${TEE_CONTROL_CLIENT_PEM_B64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$TEE_CONTROL_CLIENT_PEM_B64" | base64 -d > /tmp/tee-control-client.pem
        # Refuse to start rather than fall back to an unauthenticated
        # connection: a missing client certificate must be a hard failure.
        grep -q 'BEGIN EC PRIVATE KEY\|BEGIN PRIVATE KEY' /tmp/tee-control-client.pem
        grep -q 'BEGIN CERTIFICATE' /tmp/tee-control-client.pem
        unset TEE_CONTROL_CLIENT_PEM_B64
        exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    tmpfs:
      - /tmp:size=8m,nosuid,nodev
    mem_limit: 96m
    networks:
      cvm-control-egress:
        aliases:
          - control.anonrouter.internal
      cvm-internet: {}

  venice-worker:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:8b29ae96bb38850430d74501351156addba345bef72e6da29e1394e35ded7569
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: venice-worker
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # A LITERAL, so a verifier reading the attested manifest sees exactly
      # which upstream this build can reach. The worker has no other route.
      VENICE_BASE_URL: https://api.venice.ai/api/v1
      # The credential arrives as an ENCRYPTED environment value and is
      # written to tmpfs by the entrypoint: the split-role worker requires
      # a file and rejects a plain variable. It exists only in
      # TDX-encrypted memory, only in this container, never on disk.
      VENICE_INFERENCE_KEY_FILE: /tmp/venice-key
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      CONFIDENTIAL_DEPLOYMENT_ID: us-west-1-prod5-xl
      # AR-02: this worker holds ONLY its own provider's metadata token, so
      # a compromised worker cannot push another provider's catalog.
      METADATA_RPC_TOKEN_VENICE: ${METADATA_RPC_TOKEN_VENICE}
      CONTROL_METADATA_URL: http://control.anonrouter.internal:8444
      # The synchronizer is what keeps catalog_state.last_success_at
      # advancing. With it off the 15-minute freshness gate makes every
      # model ineligible and the API answers "Model not found", which reads
      # as an outage and is the gate working correctly.
      CATALOG_SYNC_ENABLED: "true"
      CATALOG_SYNC_INTERVAL_SECONDS: "300"
      # Credential administration terminates HERE. Capability mode closes
      # the route that let a control plane hand this worker a secret:
      # installation needs a signed, single-use, endpoint-bound
      # authorization presented directly to the attested workload.
      CREDENTIAL_ADMIN_MODE: capability
      CREDENTIAL_CAPABILITY_SIGNERS: ${CREDENTIAL_CAPABILITY_SIGNERS}
      CONTENT_TLS_SPKI_SHA256: ${CONTENT_TLS_SPKI_SHA256}
      VENICE_KEYSET_OVERLAY_FILE: /var/lib/anonrouter-worker/venice-keyset-overlay.json
      # One-time use must survive a restart: an in-memory nonce set forgets,
      # and restarting a container is not a difficult thing to arrange.
      CONSUMED_CAPABILITY_FILE: /var/lib/anonrouter-worker/consumed-venice.json
      # Deliberately NOT named VENICE_INFERENCE_KEY: config rejects an ambiguous
      # plain-variable + file combination. Removed before the app starts.
      VENICE_KEY_B64: ${VENICE_KEY_B64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$VENICE_KEY_B64" | base64 -d > /tmp/venice-key
        # Refuse to start rather than dispatch with an empty credential.
        test -s /tmp/venice-key
        unset VENICE_KEY_B64
        exec npm run start
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    volumes:
      # The only writable mount holding a secret. Written atomically at
      # mode 0600, never logged, and encrypted by the dstack key provider,
      # which releases the disk key only to a TD whose measurements match
      # this release.
      - credential-state:/var/lib/anonrouter-worker
    mem_limit: 512m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      # Its OWN rpc network, not a shared one. A compromised worker cannot
      # reach a peer worker's socket at all, which matters because
      # WORKER_RPC_TOKEN is a single shared value across workers.
      - cvm-rpc-venice
      - cvm-egress-venice
      - cvm-control-egress

  fireworks-worker:
    <<: *hardened
    image: ghcr.io/anonrouter/confidential-content-plane@sha256:8b29ae96bb38850430d74501351156addba345bef72e6da29e1394e35ded7569
    platform: linux/amd64
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: fireworks-worker
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # A LITERAL, so a verifier reading the attested manifest sees exactly
      # which upstream this build can reach. The worker has no other route.
      FIREWORKS_BASE_URL: https://api.fireworks.ai/inference/v1
      # The credential arrives as an ENCRYPTED environment value and is
      # written to tmpfs by the entrypoint: the split-role worker requires
      # a file and rejects a plain variable. It exists only in
      # TDX-encrypted memory, only in this container, never on disk.
      FIREWORKS_API_KEY_FILE: /tmp/fireworks-key
      WORKER_RPC_TOKEN: ${WORKER_RPC_TOKEN}
      CONFIDENTIAL_DEPLOYMENT_ID: us-west-1-prod5-xl
      # AR-02: this worker holds ONLY its own provider's metadata token, so
      # a compromised worker cannot push another provider's catalog.
